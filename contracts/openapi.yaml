  "components": {
    "schemas": {
      "ClaimType": {
        "type": "string",
        "enum": [
          "FACT",
          "INFERENCE",
          "HYPOTHESIS",
          "PREDICTION"
        ]
      },
      "DomainType": {
        "type": "string",
        "enum": [
          "TECH",
          "AI",
          "BUSINESS",
          "FINANCE",
          "MACRO",
          "POLICY",
          "GEOPOLITICS",
          "REAL_ESTATE",
          "ENERGY",
          "CONSUMER",
          "HEALTHCARE",
          "EMPLOYMENT",
          "OTHER"
        ]
      },
      "NewsGrade": {
        "type": "string",
        "enum": [
          "C",
          "B",
          "A",
          "S"
        ]
      },
      "JobStatus": {
        "type": "string",
        "enum": [
          "QUEUED",
          "NORMALIZING",
          "EXTRACTING_FACTS",
          "ANALYZING",
          "GENERATING_HYPOTHESES",
          "VERIFYING",
          "SYNTHESIZING",
          "COMPLETED",
          "FAILED"
        ]
      },
      "ModelPurpose": {
        "type": "string",
        "enum": [
          "FAST_ANALYSIS",
          "DEEP_ANALYSIS",
          "FACT_EXTRACTION",
          "CLASSIFICATION",
          "COUNTER_ARGUMENT",
          "SYNTHESIS"
        ]
      },
